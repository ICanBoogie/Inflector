---
services:
  app74:
    build:
      context: .
      args:
        PHP_TAG: "7.4-cli-bullseye"
    environment:
      PHP_IDE_CONFIG: 'serverName=icanboogie-inflector'
      PHPUNIT_VERSION: "09"
    volumes: &vol
    - .:/app:delegated
    - composer-cache:/root/.composer
    working_dir: /app
  app85:
    build:
      context: .
      args:
        PHP_TAG: "8.5-cli-trixie"
    environment:
      PHP_IDE_CONFIG: 'serverName=icanboogie-inflector'
      PHPUNIT_VERSION: "11"
    volumes: *vol
    working_dir: /app

volumes:
  composer-cache: ~
